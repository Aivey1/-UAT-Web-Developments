<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Player Setup</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="container">
        <h1>Game Player Setup</h1>
        <p>Enter your player information before starting the game.</p>

        <form id="gameForm">
            <label for="username">User Name</label>
            <input type="text" id="username" required>

            <label for="weapons">Weapons</label>
            <input type="text" id="weapons" required>

            <label for="health">Health/Damage</label>
            <input type="number" id="health" required>

            <label for="points">Point Total</label>
            <input type="number" id="points" required>

            <button type="submit">Submit</button>
        </form>

        <div id="output" class="output">
            <h2>Player Information</h2>
            <p id="outputUsername"></p>
            <p id="outputWeapons"></p>
            <p id="outputHealth"></p>
            <p id="outputPoints"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
