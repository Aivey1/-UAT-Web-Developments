<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkers Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <h1>Checkers Game</h1>
    <p id="status" aria-live="polite">Red's turn</p>
    <div id="board" class="board" aria-label="Checkers board"></div>
    <button id="resetButton" type="button">Reset Game</button>
    <p class="instructions">Tap a piece, then tap an empty diagonal square to move it.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
